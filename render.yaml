services:
  - type: web
    name: resqnet
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    numInstances: 1
    autoDeployTrigger: off
    disk:
      name: resqnet-data
      mountPath: /app/runtime
      sizeGB: 1
    envVars:
      - key: RESQ_DATABASE_URL
        value: sqlite:////app/runtime/resq.db
      - key: RESQ_MEDIA_DIR
        value: /app/runtime/media
      - key: RESQ_SECURE_COOKIES
        value: "true"
      - key: RESQ_AI_MODE
        value: rules
      - key: RESQ_VOICE_ENABLED
        value: "false"
