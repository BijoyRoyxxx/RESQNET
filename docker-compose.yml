services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RESQ_DATABASE_URL: sqlite:///./runtime/resq.db
      RESQ_MEDIA_DIR: runtime/media
      RESQ_AI_MODE: ${RESQ_AI_MODE:-rules}
      RESQ_OLLAMA_URL: http://host.docker.internal:11434
      RESQ_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    volumes:
      - resq-data:/app/runtime
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  resq-data:
